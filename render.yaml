services:
  # Unified Backend + Frontend Service
  - type: web
    name: umatch-financial-control
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        value: umatch-secret-key-change-in-production-12345
      - key: PYTHON_VERSION
        value: 3.9
    disk:
      name: data-storage
      mountPath: /app/data
      sizeGB: 1

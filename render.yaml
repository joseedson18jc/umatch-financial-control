# Render.com Blueprint
# Deploy with: https://render.com/deploy

services:
  - type: web
    name: umatch-financial
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: 1
    disk:
      name: umatch-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true

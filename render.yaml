services:
  # Backend Service (Python/FastAPI)
  - type: web
    name: financial-control-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FRONTEND_URL
        fromService:
          type: web
          name: financial-control-frontend
          property: url
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
    disk:
      name: data-storage
      mountPath: /app/data
      sizeGB: 1

  # Frontend Service (React/Vite)
  - type: web
    name: financial-control-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: financial-control-backend
          property: url
